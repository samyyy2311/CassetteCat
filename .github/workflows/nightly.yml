name: Nightly Build

on:
  schedule:
    - cron: '30 19 * * *'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/nightly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Build Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Skip unchanged commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          body="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .body 2>/dev/null || true)"
          tag_commit="$(git ls-remote origin refs/tags/nightly | awk '{print $1}')"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$tag_commit" = "$commit" ] && grep -Fq "Commit: $commit" <<< "$body"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check.outputs.skip != 'true'
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        if: steps.check.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Build development APK
        if: steps.check.outputs.skip != 'true'
        working-directory: ./app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare nightly assets
        id: prepare
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          apk="$(find app/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          commit="${{ steps.check.outputs.commit }}"
          date="$(date -u +%F)"
          name="CassetteCat-nightly.apk"
          mkdir -p nightly-assets
          cp "$apk" "nightly-assets/$name"
          sha256sum "nightly-assets/$name" > "nightly-assets/$name.sha256"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "short_sha=${commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: Move nightly tag and remove old assets
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          set -euo pipefail
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$COMMIT" -F force=true >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly -f sha="$COMMIT" >/dev/null
          fi
          test "$(git ls-remote origin refs/tags/nightly | awk '{print $1}')" = "$COMMIT"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id 2>/dev/null || true)"
          if [ -n "$release_id" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].id' |
              while read -r asset_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
              done
          fi

      - name: Publish nightly prerelease
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          target_commitish: ${{ steps.check.outputs.commit }}
          name: CassetteCat Nightly - ${{ steps.prepare.outputs.date }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Nightly development build. May be unstable and is intended for testing only.

            Commit: ${{ steps.check.outputs.commit }}
            Short commit: ${{ steps.prepare.outputs.short_sha }}
            Built: ${{ steps.prepare.outputs.date }} UTC
          files: |
            nightly-assets/*.apk
            nightly-assets/*.apk.sha256
