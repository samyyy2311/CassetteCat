name: Nightly Build

on:
  schedule:
    - cron: '30 19 * * *'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/nightly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Build Nightly APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Skip unchanged commit
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit="$(git rev-parse HEAD)"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id 2>/dev/null || true)"
          body=""
          prerelease="false"
          assets=""
          if [ -n "$release_id" ]; then
            body="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .body)"
            prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq .prerelease)"
            assets="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[].name' | sort)"
          fi
          tag_commit="$(git ls-remote origin refs/tags/nightly | awk '{print $1}')"
          expected_assets="$(printf '%s\n' CassetteCat-nightly.apk CassetteCat-nightly.apk.sha256 | sort)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          if [ "$tag_commit" = "$commit" ] && [ "$prerelease" = "true" ] &&
            grep -Fq "Commit: $commit" <<< "$body" && [ "$assets" = "$expected_assets" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        if: steps.check.outputs.skip != 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        if: steps.check.outputs.skip != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build development APK
        if: steps.check.outputs.skip != 'true'
        working-directory: ./app
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare nightly assets
        id: prepare
        if: steps.check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          apk="$(find app/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          commit="${{ steps.check.outputs.commit }}"
          date="$(date -u +%F)"
          name="CassetteCat-nightly.staging.apk"
          mkdir -p nightly-assets
          cp "$apk" "nightly-assets/$name"
          checksum="$(sha256sum "nightly-assets/$name" | awk '{print $1}')"
          printf '%s  %s\n' "$checksum" CassetteCat-nightly.apk > "nightly-assets/$name.sha256"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "short_sha=${commit:0:7}" >> "$GITHUB_OUTPUT"

      - name: Move nightly tag
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.check.outputs.commit }}
        run: |
          set -euo pipefail
          if ! gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" -f sha="$COMMIT" -F force=true >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/tags/nightly -f sha="$COMMIT" >/dev/null
          fi
          test "$(git ls-remote origin refs/tags/nightly | awk '{print $1}')" = "$COMMIT"

      - name: Stage nightly assets
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nightly
          target_commitish: ${{ steps.check.outputs.commit }}
          name: CassetteCat Nightly - ${{ steps.prepare.outputs.date }}
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: |
            Nightly development build. May be unstable and is intended for testing only.

            Commit: ${{ steps.check.outputs.commit }}
            Short commit: ${{ steps.prepare.outputs.short_sha }}
            Built: ${{ steps.prepare.outputs.date }} UTC
          files: |
            nightly-assets/CassetteCat-nightly.staging.apk
            nightly-assets/CassetteCat-nightly.staging.apk.sha256

      - name: Promote nightly assets
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .id)"
          assets_url="repos/$GITHUB_REPOSITORY/releases/$release_id/assets"
          staging_apk_id="$(gh api --paginate "$assets_url" --jq '.[] | select(.name == "CassetteCat-nightly.staging.apk") | .id' | head -n 1)"
          staging_sha_id="$(gh api --paginate "$assets_url" --jq '.[] | select(.name == "CassetteCat-nightly.staging.apk.sha256") | .id' | head -n 1)"
          test -n "$staging_apk_id"
          test -n "$staging_sha_id"

          for name in CassetteCat-nightly.apk CassetteCat-nightly.apk.sha256; do
            asset_id="$(gh api --paginate "$assets_url" --jq ".[] | select(.name == \"$name\") | .id" | head -n 1)"
            if [ -n "$asset_id" ]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staging_apk_id" -f name=CassetteCat-nightly.apk >/dev/null
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$staging_sha_id" -f name=CassetteCat-nightly.apk.sha256 >/dev/null

          gh api --paginate "$assets_url" --jq '.[] | select(.name != "CassetteCat-nightly.apk" and .name != "CassetteCat-nightly.apk.sha256") | .id' |
            while read -r asset_id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done

          actual_assets="$(gh api --paginate "$assets_url" --jq '.[].name' | sort)"
          expected_assets="$(printf '%s\n' CassetteCat-nightly.apk CassetteCat-nightly.apk.sha256 | sort)"
          test "$actual_assets" = "$expected_assets"
