name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant execute permission for gradlew
        working-directory: ./app
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: ./app
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ./app
        run: ./gradlew assembleDebug --stacktrace

      - name: Run Android Lint
        working-directory: ./app
        run: ./gradlew lintDebug --stacktrace

      - name: Upload Lint Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cassettecat-lint-report
          path: app/app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: cassettecat-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
