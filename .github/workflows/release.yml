name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.8.0'
        required: true
      version_code:
        description: 'Android versionCode, greater than the previous Play Store release'
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Grant execute permission for gradlew
        working-directory: ./app
        run: chmod +x gradlew

      - name: Require release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing SIGNING_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD'; exit 1; }

      - name: Validate release version code
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo 'version_code must be a positive integer'; exit 1 ;;
          esac
          test "$VERSION_CODE" -gt 0 || { echo 'version_code must be greater than zero'; exit 1; }
          test "$VERSION_CODE" -le 2100000000 || { echo 'version_code must not exceed 2100000000'; exit 1; }

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build Release APK and Bundle
        working-directory: ./app
        env:
          GITHUB_REF_NAME: v${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          REQUIRE_PRODUCTION_SIGNING: 'true'
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Prepare signed release assets
        env:
          RELEASE_TAG: v${{ inputs.version_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk="$(find app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify "$apk"
          mkdir -p release-assets
          name="CassetteCat-v${version}.apk"
          cp "$apk" "release-assets/$name"
          sha256sum "release-assets/$name" > "release-assets/$name.sha256"

      - name: Remove temporary release keystore
        if: always()
        run: rm -f release.keystore

      - name: Extract changelog section
        env:
          RELEASE_TAG: v${{ inputs.version_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) found=1
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION" >&2
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ inputs.version_name }}
          body_path: release_notes.md
          files: |
            release-assets/CassetteCat-v*.apk
            release-assets/CassetteCat-v*.apk.sha256
          generate_release_notes: false
