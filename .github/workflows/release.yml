name: Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name, e.g. 1.8.0'
        required: true
      version_code:
        description: 'Android versionCode, greater than the previous Play Store release'
        required: true

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds and signs without write access; only the publish job below can change the repository.
  build-release:
    name: Build Release Artifacts
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read

    steps:
      - name: Validate release inputs
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || { echo 'version_name must look like 1.8.0'; exit 1; }
          case "$VERSION_CODE" in
            ''|*[!0-9]*) echo 'version_code must be a positive integer'; exit 1 ;;
          esac
          test "$VERSION_CODE" -gt 0 || { echo 'version_code must be greater than zero'; exit 1; }
          test "$VERSION_CODE" -le 2100000000 || { echo 'version_code must not exceed 2100000000'; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools ndk;28.2.13676358

      # Release builds start clean rather than restoring a cache other runs wrote.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        working-directory: ./app
        run: chmod +x gradlew

      - name: Require release signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Missing SIGNING_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD'; exit 1; }

      - name: Decode release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Build Release APK and Bundle
        working-directory: ./app
        env:
          GITHUB_REF_NAME: v${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          REQUIRE_PRODUCTION_SIGNING: 'true'
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Remove temporary release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Prepare signed release assets
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          apk="$(find app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          aab="$(find app/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$aab"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --print-certs "$apk"
          jarsigner -verify "$aab" | grep -q "jar verified."
          mkdir -p release-assets play-bundle
          name="CassetteCat-v${VERSION_NAME}.apk"
          cp "$apk" "release-assets/$name"
          (cd release-assets && sha256sum "$name" > "$name.sha256")
          cp "$aab" "play-bundle/CassetteCat-v${VERSION_NAME}.aab"

      - name: Extract changelog section
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          awk -v ver="$VERSION_NAME" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") > 0) found=1
            }
            found { print }
          ' CHANGELOG.md > release-assets/release_notes.md
          if [ ! -s release-assets/release_notes.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION_NAME" >&2
            exit 1
          fi

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets
          if-no-files-found: error
          retention-days: 7

      - name: Upload Play bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-bundle
          path: play-bundle
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Verify checksum
        run: (cd release-assets && sha256sum -c ./*.sha256)

      - name: Attest release APK
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'release-assets/*.apk'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ inputs.version_name }}
          TARGET: ${{ github.sha }}
        run: |
          # A published release is never rewritten; delete it on GitHub first to publish the version again.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"
            exit 1
          fi
          # gh release create reuses an existing tag, which could point at a different commit than this build.
          # gh api prints the error body on stdout when the tag doesn't exist, so only a successful call counts.
          if tagged=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha 2>/dev/null) && [ "$tagged" != "$TARGET" ]; then
            echo "::error::Tag $TAG already points at $tagged, not $TARGET"
            exit 1
          fi
          args=("$TAG" release-assets/*.apk release-assets/*.apk.sha256 --title "$TAG" --notes-file release-assets/release_notes.md --target "$TARGET")
          [[ "$TAG" == *-* ]] && args+=(--prerelease)
          gh release create "${args[@]}"
