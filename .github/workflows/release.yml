name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 0.1.0)'
        required: false
        default: '0.1.0'

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: ./app
        run: chmod +x gradlew

      - name: Build Unsigned Release APK and Debug APK
        working-directory: ./app
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v4
        with:
          name: cassettecat-release-unsigned
          path: app/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cassettecat-debug-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
