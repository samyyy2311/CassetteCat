name: Feature request
description: Suggest something CassetteCat should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would help
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: A workaround, another app, or nothing.
    validations:
      required: false
